:root{--navy:#14243d;--navy3:#0e1a2e;--gold:#c9a227;}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f6;color:#1d2634;}

.logo{font-family:Georgia,serif;font-weight:700;letter-spacing:2.5px;font-size:17px;color:#fff;text-decoration:none;}

.navr{display:flex;align-items:center;gap:12px;}
.btn{display:inline-block;background:var(--gold);color:var(--navy3);font-weight:700;padding:9px 18px;border-radius:5px;text-decoration:none;font-size:14px;}
.btn.alt{background:transparent;border:1.5px solid var(--gold);color:var(--gold);}
.lang-toggle{background:transparent;border:1.5px solid #4b6386;color:#fff;font-weight:700;padding:8px 14px;border-radius:5px;font-size:13px;cursor:pointer;font-family:inherit;}
.lang-toggle:hover{border-color:var(--gold);color:var(--gold);}
.hdr{max-width:1120px;margin:0 auto;padding:34px 24px 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
h1{font-family:Georgia,serif;color:var(--navy);font-size:28px;font-weight:500;}
.viewer{max-width:1120px;margin:18px auto 50px;padding:0 24px;}
.frame{width:100%;height:82vh;border:1px solid #d5dce6;border-radius:8px;background:#fff;box-shadow:0 2px 10px rgba(16,26,44,.08);}
.fallback{margin-top:14px;color:#5c6675;font-size:14px;}
.fallback a{color:#a8841c;font-weight:700;}
</style>
</head>

<script>
(function(){
var STORAGE_KEY='bastion-lang';
function apply(lang){
document.querySelectorAll('[data-en]').forEach(function(el){
var v = el.getAttribute(lang==='zh' ? 'data-zh' : 'data-en');
if (v !== null) el.textContent = v;
});
document.documentElement.setAttribute('lang', lang==='zh' ? 'zh-CN' : 'en');
var btn = document.getElementById('langToggle');
if (btn) btn.textContent = lang==='zh' ? 'EN' : '中文';
try { localStorage.setItem(STORAGE_KEY, lang); } catch(e){}
}
document.addEventListener('DOMContentLoaded', function(){
var saved = 'en';
try { saved = localStorage.getItem(STORAGE_KEY) || 'en'; } catch(e){}
apply(saved);
var btn = document.getElementById('langToggle');
if (btn) btn.addEventListener('click', function(){
var cur = 'en';
try { cur = localStorage.getItem(STORAGE_KEY) || 'en'; } catch(e){}
apply(cur === 'en' ? 'zh' : 'en');
});
});
})();
</script>
</body>
